DEFAULT vesamenu.c32
PROMPT 0
TIMEOUT 100
ONTIMEOUT flinuxjc64

MENU TITLE flinux-jc64
MENU BACKGROUND fjcbg.png
MENU MARGIN 6
MENU VSHIFT 1
MENU ROWS 13
MENU TABMSGROW 19
MENU TABMSG Press ENTER to boot, TAB to edit.
MENU AUTOBOOT flinux-jc64 will boot in # second{,s}...
MENU HELPMSGROW 21
MENU COLOR border       * #00000000 #00000000 none
MENU COLOR title        * #ffffa040 #00000000 none
MENU COLOR sel          * #ffffffff #cc8c3a10 none
MENU COLOR unsel        * #ffffe0c0 #00000000 none
MENU COLOR help         * #ffffd9b0 #00000000 none
MENU COLOR timeout_msg  * #ffffe0c0 #00000000 none
MENU COLOR timeout      * #ffffa040 #00000000 none
MENU COLOR tabmsg       * #ffffe0c0 #00000000 none

LABEL flinuxjc64
MENU DEFAULT
MENU LABEL Boot flinux-jc64 (FLWM clasico, Xorg)
TEXT HELP
flinux-jc64: Tiny Core 17.1 x86_64 remaster with Xorg, ALSA,
FLRadio, FLTV, FreeTube, FLConnect.
ENDTEXT
KERNEL /boot/vmlinuz64
INITRD /boot/corepure64.gz
APPEND loglevel=3 cde showapps desktop=flwm waitusb=10:LABEL=FLINUX-JC64 nortc tz=America/Havana

LABEL core
MENU LABEL Boot Core (command line only)
KERNEL /boot/vmlinuz64
INITRD /boot/corepure64.gz
APPEND loglevel=3 base waitusb=5
